[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tipcalc"
version = "1.0.0"
description = "Split a restaurant bill, tip included."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Ada Lovelace" }]
dependencies = []          # for example ["requests>=2.30"]

[project.scripts]
tip = "tipcalc.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
